name: Release gem

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Only release from the default branch
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: write # to push the version tag
      id-token: write # for RubyGems trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch tags so we can check the version is new

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true

      - name: Check version is new
        run: |
          version=$(ruby -r ./lib/cronofy/version -e 'puts Cronofy::VERSION')
          echo "Version: $version"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists. Bump lib/cronofy/version.rb before releasing."
            exit 1
          fi

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version."
            exit 1
          fi

      - name: Run specs
        run: bundle exec rake spec

      - name: Configure git user for the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Builds the gem, creates and pushes the v<version> tag, and pushes the gem to RubyGems
      - uses: rubygems/release-gem@v1
